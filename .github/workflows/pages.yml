# SPDX-License-Identifier: GPL-3.0-only
# Publish the GitHub Pages site: the web installer (web/) and the package it installs, with every licence.
#   workflow_dispatch (version, ref) -> download transit-VERSION.fwsc from the release vVERSION (and the other versions
#                                       of web/releases.json from theirs, when they exist), check them against the
#                                       sha256s of web/releases.json, run the installer's tests on it,
#                                       tools/make_site.py, deploy to Pages
#   release published                -> starts the dispatch above from the default branch (the github-pages
#                                       environment only accepts deployments from it), the site built from the tag
#   push to main touching the page   -> the same for web/releases.json's first version, the site built from main (a
#                                       change of the page or the licences); skipped with a notice while that version
#                                       has no release yet (releases.json is committed before its tag)
# release.yml starts the dispatch itself after it made the release. Settings -> Pages -> Source must be
# "GitHub Actions".
name: pages

on:
  push:
    branches: [main]
    paths: ["web/**", "tools/make_site.py", "LICENSE", "LICENSING.md", "LICENSES/**"]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, e.g. 0.1 (the release v0.1 must carry transit-0.1.fwsc)"
        required: true
        type: string
      ref:
        description: "Branch, tag or commit the site is built from (blank: the default branch)"
        required: false
        default: ""
        type: string

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  redispatch:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Start the site build from the default branch
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          if [[ "$TAG" != v* || ! "$version" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "::notice::release $TAG is not a vX.Y or vX.Y.Z tag: the site stays as it is (run pages.yml by hand)"
            exit 0
          fi
          gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref "$DEFAULT_BRANCH" -f version="$version" -f ref="$TAG"

  site:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      skip: ${{ steps.packages.outputs.skip }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: The version (the dispatch's, or on a push web/releases.json's first)
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          v="$INPUT_VERSION"
          if [ -z "$v" ]; then v=$(python3 -c 'import json; print(json.load(open("web/releases.json"))["releases"][0]["version"])'); fi
          if [[ ! "$v" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?(-[A-Za-z0-9.]+)?$ ]]; then
            echo "::error::version '$v' is not X.Y, X.Y.Z or X.Y-suffix (e.g. 0.1, without the v)"
            exit 1
          fi
          echo "VERSION=$v" >> "$GITHUB_ENV"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: The version is the one the page installs
        run: |
          set -euo pipefail
          first=$(python3 -c 'import json; print(json.load(open("web/releases.json"))["releases"][0]["version"])')
          if [ "$first" != "$VERSION" ]; then
            echo "::error::web/releases.json lists $first first, not $VERSION: the page would install $first"
            exit 1
          fi

      - name: Download the packages from their releases
        id: packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = push ] && ! gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::notice::web/releases.json lists $VERSION first and its release v$VERSION is not made yet: the site stays as it is (release.yml publishes it with the release)"
            echo "skip=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p build/packages
          python3 -c 'import json; [print(r["version"]) for r in json.load(open("web/releases.json"))["releases"]]' |
          while read -r v; do
            if ! gh release download "v$v" --repo "$GITHUB_REPOSITORY" --pattern "transit-$v.fwsc" --dir build/packages --clobber; then
              if [ "$v" = "$VERSION" ]; then
                echo "::error title=No package for v$v::The release v$v does not exist or has no asset transit-$v.fwsc. Push the tag v$v so release.yml builds and attaches it, then run pages.yml again."
                exit 1
              fi
              echo "::warning::v$v has no transit-$v.fwsc: not published"
            fi
          done
          ls -l build/packages

      - name: Build the site (tools/make_site.py checks every sha256)
        if: steps.packages.outputs.skip != '1'
        run: |
          set -euo pipefail
          python3 tools/make_site.py build/packages build/site
          node web/test_installer.mjs "build/packages/transit-$VERSION.fwsc"
          (cd build/site/firmware && sha256sum -c SHA256SUMS)
          find build/site -type f | sort

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: steps.packages.outputs.skip != '1'
        with:
          path: build/site

  deploy:
    needs: site
    if: needs.site.outputs.skip != '1'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
